name: Promote

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to promote (for example v0.1.0)'
        required: true
      target_environment:
        description: 'Promotion target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}

    steps:
      - name: Checkout requested release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.PI_SSH_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.PI_HOST }}' >> ~/.ssh/known_hosts

      - name: Capture rollback snapshot on target
        env:
          PI_USER: ${{ secrets.PI_USER }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_PATH: ${{ secrets.PI_PATH }}
          SNAPSHOT_ID: ${{ github.event.inputs.target_environment }}-${{ github.event.inputs.version }}-${{ github.run_number }}
        run: make backup-remote

      - name: Deploy requested release to target
        env:
          PI_USER: ${{ secrets.PI_USER }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_PATH: ${{ secrets.PI_PATH }}
        run: make deploy

      - name: Run post-deploy diagnostics
        env:
          PI_USER: ${{ secrets.PI_USER }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_PATH: ${{ secrets.PI_PATH }}
        run: make remote-diagnose

      - name: Run performance checks for staging
        if: ${{ github.event.inputs.target_environment == 'staging' }}
        env:
          PI_USER: ${{ secrets.PI_USER }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_PATH: ${{ secrets.PI_PATH }}
        run: make perf
