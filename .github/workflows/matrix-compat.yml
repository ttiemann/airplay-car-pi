name: Matrix Compatibility

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  matrix-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pi-zero-w-bookworm-armv6
            base_image: debian:bookworm
            platform: linux/arm/v5
          - profile: pi-zero-w-trixie-armv6
            base_image: debian:trixie
            platform: linux/arm/v5
          - profile: pi-zero2w-bookworm-arm64
            base_image: debian:bookworm
            platform: linux/arm64
          - profile: pi-zero2w-trixie-arm64
            base_image: debian:trixie
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build compatibility image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg BASE_IMAGE="${{ matrix.base_image }}" \
            --file Dockerfile \
            --tag "airplay-car-pi:${{ matrix.profile }}" \
            .

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shell syntax and unit tests
        run: make check unit

      - name: Validate release scripts
        run: |
          bash -n scripts/release/generate_changelog.sh scripts/release/package_release.sh
          make changelog VERSION=v0.0.1
          make package VERSION=v0.0.1
          rm -f dist/CHANGELOG-v0.0.1.md dist/airplay-car-pi-v0.0.1.tar.gz dist/airplay-car-pi-v0.0.1.zip dist/airplay-car-pi-v0.0.1.sha256
